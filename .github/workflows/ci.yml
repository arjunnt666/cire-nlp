name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests
        run: python -m unittest test_cire.py -v
      - name: smoke
        run: python cire_engine.py --smoke
      - name: argv
        run: python cire_engine.py "rules for topic b"
